# ZeroWichtel – erzeugt von deploy/install-docker-caddy.sh (wird bei Updates überschrieben).
# Kein veröffentlichter Port: erreichbar nur über das Docker-Netz „zerowichtel-proxy“,
# in das der Reverse Proxy (Caddy) zusätzlich eingehängt wird.
name: zerowichtel

services:
  app:
    build: ./build
    image: zerowichtel:local
    container_name: zerowichtel
    hostname: zerowichtel
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./config:/etc/zerowichtel:ro          # Ordner, nicht Einzeldatei – Änderungen kommen sicher an
      - ./data:/app/data
    networks:
      proxy:
        aliases: [zerowichtel]
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "3"}

networks:
  proxy:
    name: zerowichtel-proxy
    external: true
